name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'guides/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, next]
    paths-ignore:
      - '**.md'
      - 'guides/**'
      - 'LICENSE'
      - '.gitignore'

  # paths-ignore means a docs-only stretch produces no CI run at all, so a
  # dependency moving underneath a pin goes unnoticed. A weekly run catches
  # rot that no commit would have triggered.
  schedule:
    - cron: '19 5 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.1.4
    permissions:
      contents: write
      pull-requests: write
    with:
      version-file: '.tool-versions'
      otp-matrix: '["28", "29"]'
      enable-ct: true
      # Diff-scoped: only lines a PR changes are mutated, so this gates
      # new code without a retroactive sweep of every existing test.
      enable-mutate: true
      mutate-diff: true
      mutate-min-score: 75
      extra-services-compose: 'test/docker-compose.yml'
      enable-ex-doc: true
      enable-audit: true
      enable-coverage: true
      enable-elp-lint: true
      enable-elp-eqwalize: true
      enable-sbom: false
      enable-sbom-scan: false
      enable-dependency-submission: true
      enable-summary: true

  # The job above runs the suites on the PostgreSQL the compose file starts by
  # default. This one runs them on every other major minato says it supports,
  # each with the two PgBouncers the compose file puts in front of it.
  postgres:
    name: Common Test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '15', '16', '18']
    env:
      MINATO_PG_TAG: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: Taure/erlang-ci@21e63960b4314b411e6dcd5fc1b7bea67d851fcb # v2.1.4
        with:
          version-file: '.tool-versions'
      - name: Start PostgreSQL ${{ matrix.postgres }} and the poolers
        run: docker compose -f test/docker-compose.yml up -d --wait
      - name: Which server answered
        run: >-
          docker exec minato-differential-postgres
          psql -U minato -d minato_test -Atc 'SHOW server_version'
      - name: Common Test
        timeout-minutes: 10
        run: rebar3 ct
      - name: The Common Test logs, which say which case
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ct-logs-postgres-${{ matrix.postgres }}-${{ github.run_attempt }}
          path: _build/test/logs
          retention-days: 5

  # Mutation testing runs `<module>_tests` against a module, or the tests
  # rebar.config names for it, and passes over a module that has neither
  # without a word. So a module without them is an error here, and so is one
  # rebar.config names no tests for.
  scored:
    name: Every module has tests mutation can run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Look for a module mutation testing would skip
        run: |
          unscored=0
          for source in src/*.erl; do
            module=$(basename "$source" .erl)
            if [ ! -f "test/${module}_tests.erl" ] &&
               ! grep -Ezq "[[:space:]]${module} => \[[[:space:]]*[a-z]" rebar.config; then
              echo "::error file=${source}::${module} has no ${module}_tests and no tests named for it under eunit_tests in rebar.config, so mutation testing skips it"
              unscored=1
            fi
          done
          exit "$unscored"

  release:
    needs: [ci, postgres, scored]
    if: ${{ github.event_name == 'push' }}
    uses: Taure/erlang-ci/.github/workflows/release.yml@v2.3.2
    permissions:
      contents: write

  hex-publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: Taure/erlang-ci/.github/workflows/hex-publish.yml@v2.3.2
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release.outputs.tag }}
