services:
  postgres:
    image: postgres:17
    container_name: minato-differential-postgres
    command:
      - -c
      - max_connections=500
      - -c
      - timezone=UTC
    environment:
      POSTGRES_USER: minato
      POSTGRES_PASSWORD: minato
      POSTGRES_DB: minato_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minato -d minato_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  postgres-tls:
    image: postgres:17
    container_name: minato-tls-postgres
    user: root
    volumes:
      - ./certs:/certs:ro
    command:
      - bash
      - -c
      - >-
        install -o postgres -g postgres -m 600 /certs/server.key /tmp/server.key &&
        install -o postgres -g postgres -m 644 /certs/server.crt /tmp/server.crt &&
        exec docker-entrypoint.sh postgres
        -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
        -c timezone=UTC
    environment:
      POSTGRES_USER: minato
      POSTGRES_PASSWORD: minato
      POSTGRES_DB: minato_test
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minato -d minato_test"]
      interval: 2s
      timeout: 5s
      retries: 20
