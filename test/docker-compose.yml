services:
  postgres:
    image: postgres:17
    container_name: minato-differential-postgres
    command:
      - -c
      - max_connections=500
      - -c
      - timezone=UTC
    environment:
      POSTGRES_USER: minato
      POSTGRES_PASSWORD: minato
      POSTGRES_DB: minato_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minato -d minato_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  postgres-tls:
    image: postgres:17
    container_name: minato-tls-postgres
    user: root
    volumes:
      - ./certs:/certs
    command:
      - bash
      - -c
      - >-
        openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes
        -keyout /tmp/ca.key -out /certs/ca.crt -subj "/CN=minato test CA"
        -addext "basicConstraints=critical,CA:TRUE" &&
        openssl req -newkey rsa:2048 -nodes -keyout /tmp/server.key
        -out /tmp/server.csr -subj "/CN=localhost" &&
        printf "subjectAltName=DNS:localhost\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n"
        > /tmp/server.ext &&
        openssl x509 -req -in /tmp/server.csr -CA /certs/ca.crt -CAkey /tmp/ca.key
        -CAserial /tmp/ca.srl -CAcreateserial -out /certs/server.crt -days 3650 -sha256
        -extfile /tmp/server.ext &&
        chown postgres:postgres /tmp/server.key && chmod 600 /tmp/server.key &&
        install -o postgres -g postgres -m 644 /certs/server.crt /tmp/server.crt &&
        chmod 644 /certs/ca.crt /certs/server.crt &&
        exec docker-entrypoint.sh postgres
        -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
        -c timezone=UTC
    environment:
      POSTGRES_USER: minato
      POSTGRES_PASSWORD: minato
      POSTGRES_DB: minato_test
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minato -d minato_test"]
      interval: 2s
      timeout: 5s
      retries: 20
