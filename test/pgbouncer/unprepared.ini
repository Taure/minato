[databases]
minato_test = host=postgres port=5432 dbname=minato_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/minato/userlist.txt
admin_users = minato
pool_mode = transaction
min_pool_size = 2
default_pool_size = 2
max_client_conn = 200
max_prepared_statements = 0
server_round_robin = 1
